<rect width="960" height="560" fill="#fafbfc"/>
<g font-family="Arial, sans-serif"><text x="56" y="78" font-size="14" fill="#697586" letter-spacing="2">ENGINEERING OVERVIEW</text><text x="56" y="128" font-size="34" fill="#253047" font-weight="600">VeBench</text><text x="56" y="165" font-size="17" fill="#687386">From reproducible tasks to evidence-backed release decisions</text><rect x="56" y="228" width="182" height="146" rx="7" fill="white" stroke="#d4dbe5"/><text x="74" y="260" font-size="13" fill="#8090a5">01</text><text x="74" y="294" font-size="20" fill="#253047" font-weight="600">Version</text><text x="74" y="324" font-size="14" fill="#667386">Tasks, images</text><text x="74" y="346" font-size="14" fill="#667386">and harnesses</text><path d="M242 300 H272" stroke="#8e99ad" fill="none" marker-end="url(#arrow)"/><rect x="278" y="228" width="182" height="146" rx="7" fill="white" stroke="#d4dbe5"/><text x="296" y="260" font-size="13" fill="#8090a5">02</text><text x="296" y="294" font-size="20" fill="#253047" font-weight="600">Execute</text><text x="296" y="324" font-size="14" fill="#667386">Isolated sandboxes</text><text x="296" y="346" font-size="14" fill="#667386">and capacity control</text><path d="M464 300 H494" stroke="#8e99ad" fill="none" marker-end="url(#arrow)"/><rect x="500" y="228" width="182" height="146" rx="7" fill="white" stroke="#d4dbe5"/><text x="518" y="260" font-size="13" fill="#8090a5">03</text><text x="518" y="294" font-size="20" fill="#253047" font-weight="600">Observe</text><text x="518" y="324" font-size="14" fill="#667386">Requests, tool calls</text><text x="518" y="346" font-size="14" fill="#667386">and execution traces</text><path d="M686 300 H716" stroke="#8e99ad" fill="none" marker-end="url(#arrow)"/><rect x="722" y="228" width="182" height="146" rx="7" fill="white" stroke="#d4dbe5"/><text x="740" y="260" font-size="13" fill="#8090a5">04</text><text x="740" y="294" font-size="20" fill="#253047" font-weight="600">Evaluate</text><text x="740" y="324" font-size="14" fill="#667386">Failure attribution</text><text x="740" y="346" font-size="14" fill="#667386">and release checks</text><path d="M813 388 V418 H148 V389" stroke="#a6b1c0" fill="none" stroke-dasharray="4 5" marker-end="url(#arrow)"/><text x="480" y="460" text-anchor="middle" font-size="16" fill="#667386">Compare experiments · inspect failures · rerun under the same conditions</text><text x="56" y="520" font-size="12" fill="#8a94a3">CONCEPTUAL WORKFLOW · XIAO ZHOU</text></g></svg>