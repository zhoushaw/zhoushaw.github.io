<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">VeBench</title><desc id="desc">From reproducible tasks to evidence-backed release decisions. Version — Tasks, images; Execute — Isolated sandboxes; Observe — Requests, tool calls; Evaluate — Failure attribution.</desc>
